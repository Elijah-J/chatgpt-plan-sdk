[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-plan-sdk"
version = "0.1.0"
description = "Explicit streaming Responses SDK for Sign in with ChatGPT plan usage"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {file = "LICENSE"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "anyio>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Elijah-J/chatgpt-plan-sdk"
Documentation = "https://github.com/Elijah-J/chatgpt-plan-sdk#readme"
Issues = "https://github.com/Elijah-J/chatgpt-plan-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chatgpt_plan_sdk*"]

[tool.setuptools.package-data]
chatgpt_plan_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
